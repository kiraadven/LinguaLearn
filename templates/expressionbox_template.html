<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>表达框</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            width: {{width}}px;
            height: {{h}}px;
            background: transparent;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
            overflow: hidden;
        }
        
        .expr-box-container {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            padding: 0;
            margin: 0;
            gap: 0;
            background: {{bg_color}};
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 0;
            box-shadow: none;
            overflow: hidden;
        }
        
        .expr-list {
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            height: 100%;
            width: 100%;
            padding: 0;
            margin: 0;
            gap: 2px;
        }
        
        .expr-item {
            display: flex;
            flex-direction: column;
            gap: 0px;
            padding: 0;
            margin: 0;
            flex-shrink: 0;
        }
        
        .expr-english {
            font-size: {{font_size_en}}px;
            font-weight: 700;
            color: {{en_color}};
            white-space: normal;
            word-wrap: break-word;
            overflow-wrap: break-word;
            text-shadow: 0 1px 3px rgba(52, 211, 153, 0.3);
            margin: 0;
            padding: 0;
        }
        
        .expr-chinese {
            font-size: {{font_size_cn}}px;
            font-weight: 500;
            color: {{cn_color}};
            opacity: 0.9;
            line-height: 1.15;
            white-space: normal;
            word-wrap: break-word;
            overflow-wrap: break-word;
            margin: 0;
            padding: 0;
        }
    </style>
</head>
<body>
    <div class="expr-box-container">
        <div class="expr-list">
            {{expressions_html}}
        </div>
    </div>
</body>
</html>
