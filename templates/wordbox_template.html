<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>单词框</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            width: {{width}}px;
            height: {{h}}px;
            background: transparent;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
            overflow: hidden;
        }
        
        .word-box-container {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            /* 完全0边距 */
            padding: 0;
            margin: 0;
            gap: 0;
            /* 毛玻璃效果 */
            background: rgba(20, 20, 40, 0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 0;
            box-shadow: none;
            overflow: hidden;
        }
        
        /* 单词列表容器 - 完全0边距 */
        .word-list {
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            height: 100%;
            width: 100%;
            /* 完全0边距 */
            padding: 0;
            margin: 0;
            gap: 2px;
        }
        
        /* 每个单词项 */
        .word-item {
            display: flex;
            flex-direction: column;
            gap: 0px;
            padding: 0;
            margin: 0;
            flex-shrink: 0;
        }
        
        /* 单词和音标在同一行 */
        .word-row {
            display: flex;
            align-items: baseline;
            gap: 4px;
            margin: 0;
            padding: 0;
        }
        
        .word {
            font-size: {{font_size_word}}px;
            font-weight: 700;
            color: #60a5fa;
            white-space: nowrap;
            text-shadow: 0 1px 3px rgba(96, 165, 250, 0.3);
            margin: 0;
            padding: 0;
        }
        
        .phonetic {
            font-size: {{font_size_phonetic}}px;
            color: #94a3b8;
            font-family: "SF Mono", Monaco, "Courier New", monospace;
            white-space: nowrap;
            margin: 0;
            padding: 0;
        }
        
        .translation {
            font-size: {{font_size_trans}}px;
            font-weight: 500;
            color: #e2e8f0;
            opacity: 0.9;
            line-height: 1.15;
            margin: 0;
            padding: 0;
        }
    </style>
</head>
<body>
    <div class="word-box-container">
        <div class="word-list">
            {{words_html}}
        </div>
    </div>
</body>
</html>
