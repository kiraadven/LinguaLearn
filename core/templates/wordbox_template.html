<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>单词框</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            width: {{width}}px;
            height: {{h}}px;
            background: {{bg_color}};
            font-family: {{font_family}};
            overflow: hidden;
        }

        .word-box-container {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            padding: {{padding}}px;
            background: {{bg_color}};
            overflow: hidden;
        }

        .box-label {
            font-size: {{label_size}}px;
            font-weight: 700;
            color: {{label_color}};
            letter-spacing: 1.5px;
            text-transform: uppercase;
            margin-bottom: {{label_margin}}px;
            opacity: 0.6;
        }

        .word-list {
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            flex: 1;
            gap: {{item_gap}}px;
            overflow: hidden;
        }

        .word-item {
            display: flex;
            flex-direction: row;
            align-items: center;
            gap: {{item_inner_gap}}px;
            padding: {{item_pad_v}}px {{item_pad_h}}px;
            background: {{item_bg}};
            border-radius: {{item_radius}}px;
            border-left: {{accent_w}}px solid {{accent_color}};
            flex-shrink: 0;
            overflow: hidden;
        }

        .word-left {
            display: flex;
            flex-direction: column;
            gap: 1px;
            min-width: 0;
            flex: 0 0 auto;
        }

        .word {
            font-size: {{font_size_word}}px;
            font-weight: 700;
            color: {{word_color}};
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            line-height: {{line_height_src}};
        }

        .phonetic {
            font-size: {{font_size_phonetic}}px;
            color: {{phonetic_color}};
            font-family: {{mono_font}};
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            line-height: 1.2;
            opacity: 0.85;
        }

        .word-right {
            flex: 1;
            min-width: 0;
            display: flex;
            align-items: center;
        }

        .translation {
            font-size: {{font_size_trans}}px;
            font-weight: 500;
            color: {{trans_color}};
            line-height: {{line_height_tgt}};
            white-space: normal;
            word-wrap: break-word;
            overflow: hidden;
            opacity: 0.92;
        }
    </style>
</head>
<body>
    <div class="word-box-container">
        <div class="box-label">{{label_text}}</div>
        <div class="word-list">
            {{words_html}}
        </div>
    </div>
</body>
</html>
