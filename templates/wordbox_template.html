<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>单词框</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            width: {{width}}px;
            height: {{h}}px;
            background: {{bg_color}};
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
            overflow: hidden;
        }
        
        .word-box-container {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            padding: 0;
            margin: 0;
            gap: 0;
            background: {{bg_color}};
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 0;
            box-shadow: none;
            overflow: hidden;
        }
        
        .word-list {
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            height: 100%;
            width: 100%;
            padding: 0;
            margin: 0;
            gap: 2px;
        }
        
        .word-item {
            display: flex;
            flex-direction: column;
            gap: 0px;
            padding: 0;
            margin: 0;
            flex-shrink: 0;
        }
        
        .word-row {
            display: flex;
            flex-wrap: wrap;
            align-items: baseline;
            gap: 4px;
            margin: 0;
            padding: 0;
        }
        
        .word {
            font-size: {{font_size_word}}px;
            font-weight: 700;
            color: {{word_color}};
            white-space: normal;
            word-wrap: break-word;
            overflow-wrap: break-word;
            text-shadow: 0 1px 3px rgba(96, 165, 250, 0.3);
            margin: 0;
            padding: 0;
        }
        
        .phonetic {
            font-size: {{font_size_phonetic}}px;
            color: {{phonetic_color}};
            font-family: "SF Mono", Monaco, "Courier New", monospace;
            white-space: normal;
            word-wrap: break-word;
            overflow-wrap: break-word;
            margin: 0;
            padding: 0;
        }
        
        .translation {
            font-size: {{font_size_trans}}px;
            font-weight: 500;
            color: {{trans_color}};
            opacity: 0.9;
            line-height: 1.15;
            white-space: normal;
            word-wrap: break-word;
            overflow-wrap: break-word;
            margin: 0;
            padding: 0;
        }
    </style>
</head>
<body>
    <div class="word-box-container">
        <div class="word-list">
            {{words_html}}
        </div>
    </div>
</body>
</html>
