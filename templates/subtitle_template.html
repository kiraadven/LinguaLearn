<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>字幕框</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            width: {{width}}px;
            height: {{height}}px;
            background: transparent;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
            overflow: hidden;
        }
        
        .subtitle-container {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            /* 完全0边距 */
            padding: 0;
            margin: 0;
            /* 毛玻璃效果 */
            background: rgba(20, 20, 40, 0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 0;
            box-shadow: none;
            overflow: hidden;
        }
        
        .english-text {
            font-size: {{font_size_en}}px;
            font-weight: 600;
            color: #60a5fa;
            text-align: center;
            line-height: 1.3;
            letter-spacing: 0.3px;
            max-width: 95%;
            word-wrap: break-word;
            overflow-wrap: break-word;
            text-shadow: 0 2px 8px rgba(96, 165, 250, 0.3);
            margin: 0;
            padding: 0;
        }
        
        .chinese-text {
            font-size: {{font_size_cn}}px;
            font-weight: 400;
            color: #ffffff;
            text-align: center;
            line-height: 1.4;
            margin: 0;
            padding: 0;
            opacity: 0.95;
            text-shadow: 0 1px 4px rgba(0, 0, 0, 0.3);
            max-width: 95%;
            word-wrap: break-word;
            overflow-wrap: break-word;
        }
    </style>
</head>
<body>
    <div class="subtitle-container">
        <div class="english-text">{{english_text}}</div>
        <div class="chinese-text">{{chinese_text}}</div>
    </div>
</body>
</html>
