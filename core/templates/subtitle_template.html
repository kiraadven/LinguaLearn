<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>字幕框</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            width: {{width}}px;
            height: {{height}}px;
            background: {{bg_color}};
            font-family: {{font_family}};
            overflow: hidden;
        }

        .subtitle-container {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: {{padding}}px {{padding_h}}px;
            background: {{bg_color}};
            overflow: hidden;
            position: relative;
        }

        /* optional left accent bar */
        .subtitle-container::before {
            content: '';
            position: absolute;
            left: 0; top: 15%; bottom: 15%;
            width: {{accent_bar_w}}px;
            background: {{accent_color}};
            border-radius: 0 4px 4px 0;
            opacity: {{accent_opacity}};
        }

        .src-text {
            font-size: {{font_size_src}}px;
            font-weight: {{src_weight}};
            color: {{en_color}};
            text-align: center;
            line-height: {{line_height_src}};
            letter-spacing: {{letter_spacing_src}}px;
            max-width: 95%;
            word-wrap: break-word;
            overflow-wrap: break-word;
            white-space: normal;
            margin: 0;
            padding: 0;
        }

        .divider {
            width: {{divider_w}}%;
            height: {{divider_h}}px;
            background: {{divider_color}};
            margin: {{divider_margin}}px auto;
            border-radius: 2px;
            opacity: {{divider_opacity}};
        }

        .tgt-text {
            font-size: {{font_size_tgt}}px;
            font-weight: {{tgt_weight}};
            color: {{cn_color}};
            text-align: center;
            line-height: {{line_height_tgt}};
            letter-spacing: {{letter_spacing_tgt}}px;
            max-width: 95%;
            word-wrap: break-word;
            overflow-wrap: break-word;
            white-space: normal;
            opacity: {{tgt_opacity}};
            margin: 0;
            padding: 0;
        }
    </style>
</head>
<body>
    <div class="subtitle-container">
        <div class="src-text">{{english_text}}</div>
        <div class="divider"></div>
        <div class="tgt-text">{{chinese_text}}</div>
    </div>
</body>
</html>
